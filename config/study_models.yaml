    alias: sol
    route: openai
    temperature: 1
    max_tokens: 16000
    batch_prices: {input: 1, cached_input: 0.05, output: 5, cache_write: 1.25}
  - id: google/gemini-3.1-pro-preview
    alias: gemini
    route: openrouter
