# USD per million tokens. Null host/quantization means no enforceable pin
# has been verified. Such entries are usable for planning, but not submission.
models:
  - id: claude-opus-5-5
    alias: opus
    route: anthropic
    reasoning_mode: always_on
    max_tokens: 16000
    batch_prices: {input: 2, cached_input: 0.2, output: 10, cache_write: 2.5}
