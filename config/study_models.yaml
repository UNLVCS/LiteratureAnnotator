sample_prefixes:
  - study_v1/s00
  - study_v1/s01
  - study_v1/s02
  - study_v1/s03
  - study_v1/s04
  - study_v1/s05

# USD per million tokens. OpenRouter uses the listed provider slug.
models:
  # Claude and GPT go through OpenRouter (one bill), pinned to their first-party hosts.
  # cache_write is the 1-hour cache rate (2x input); see OpenRouterBatches.request.
  - id: anthropic/claude-opus-5.5
    alias: opus
    route: openrouter
    host: anthropic
    reasoning_mode: always_on
    max_tokens: 16000
    batch_prices: {input: 2, cached_input: 0.1, output: 10, cache_write: 4}
  - id: openai/gpt-6.2-sol
    alias: sol
    route: openrouter
    host: openai
    temperature: 1
    max_tokens: 16000
    batch_prices: {input: 1, cached_input: 0.05, output: 5, cache_write: 1.25}
  - id: google/gemini-4-carbon
    alias: gemini
    route: openrouter
    host: google-vertex
    temperature: 1
    max_tokens: 16000
    batch_prices: {input: 1, cached_input: 1, output: 6}
  - id: deepseek/deepseek-v4.1-flash-1017
    alias: deepseek
    route: openrouter
    host: morph
    temperature: 1
    max_tokens: 16000
    batch_prices: {input: 0.035, cached_input: 0.0029, output: 0.149}
  - id: qwen/qwen3.8-max-0902
    alias: qwen
    route: openrouter
    host: alibaba
    temperature: 1
    max_tokens: 16000
    batch_prices: {input: 1.15, cached_input: 1.15, output: 3.45}
  - id: z-ai/glm-5.3
    alias: glm
    route: openrouter
    host: morph
    temperature: 1
    reasoning_mode: always_on
    max_tokens: 16000
    batch_prices: {input: 0.281, cached_input: 0.061, output: 1.25}
