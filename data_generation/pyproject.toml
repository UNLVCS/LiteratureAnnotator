[project]
name = "literature-annotator-data-generation"
version = "0.1.0"
description = "Whole-paper LLM labeling scripts."
requires-python = ">=3.10"
dependencies = [
  "literature-annotator-papers",
  "langchain>=0.1.0",
  "langchain-core>=0.1.0",
  "langchain-openai>=0.1.0",
  "minio>=7.2.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "redis>=5.0.0",
  "requests>=2.31.0",
  "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
providers = [
  "langchain-anthropic>=0.1.0",
  "langchain-huggingface>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
literature-annotator-papers = { workspace = true }
