[project]
name = "literature-annotator-data-analysis"
version = "0.1.0"
description = "Sample generation and semantic entropy analysis scripts."
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.1.0",
  "langchain-core>=0.1.0",
  "langchain-openai>=0.1.0",
  "langchain-pinecone>=0.1.0",
  "minio>=7.2.0",
  "openai>=1.0.0",
  "pinecone>=3.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "redis>=5.0.0",
  "requests>=2.31.0",
  "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
providers = [
  "langchain-anthropic>=0.1.0",
  "langchain-huggingface>=0.1.0",
  "vllm>=0.5.0",
]

[tool.uv]
package = false
