version: "3.8"

services:
  # ===========================================
  # PostgreSQL - Database for Label Studio
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: annotation-postgres
    restart: unless-stopped
    environment:
      # Only consulted when initializing an empty data directory. On an
      # existing volume the live password is whatever Vault last set — see
      # ops/vault/bootstrap_postgres_engine.sh.
      - POSTGRES_USER=labelstudio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-labelstudio}
      - POSTGRES_DB=labelstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelstudio -d labelstudio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - annotation-network

  # ===========================================
  # Redis - Message Queue & Caching
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: annotation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - annotation-network

  # ===========================================
  # Label Studio - Annotation Platform
  # ===========================================
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: annotation-label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # PostgreSQL database connection
      - DJANGO_DB=default
      - POSTGRE_HOST=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_NAME=labelstudio
      # Short-lived credentials issued by Vault's database engine and written
      # into label_api/.env by ops/vault/refresh_postgres_creds.sh.
      - POSTGRE_USER=${POSTGRE_USER:-labelstudio}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD:-labelstudio}
      # File serving
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      # Webhook settings
      - LABEL_STUDIO_WEBHOOK_ENABLED=true
      # Disable signup for production (uncomment if needed)
      # - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
    volumes:
      - label_studio_data:/label-studio/data
      - label_studio_files:/label-studio/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - annotation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================
  # Vault - Secrets Store
  # ===========================================
  vault:
    image: hashicorp/vault:1.21.4
    container_name: annotation-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - ./../vault/config/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./../vault/tls:/vault/tls:ro
    command: vault server -config=/vault/config/vault-config.hcl
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - annotation-network

  # ===========================================
  # FastAPI Backend - Webhook Handler & Queue
  # ===========================================
  fastapi-backend:
    build:
      context: ..
      dockerfile: label_api/Dockerfile
    container_name: annotation-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Hot reload for development
    command: >
      uvicorn label_api.app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/label_api
      --reload-dir /app/utilities
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_CACERT=/app/vault-ca.pem
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_SECRET_ID_FILE=/app/.vault-secret-id
    volumes:
      - ../.env.yaml:/app/.env.yaml:ro
      - ../.env.docker-override.yaml:/app/override.env.yaml:ro
      - ../vault/tls/vault-cert.pem:/app/vault-ca.pem:ro
      - ../.vault-secret-id:/app/.vault-secret-id:ro
      # Persist annotations and data
      - annotation_data:/app/data_labeling
      # Mount source for development (optional - remove in production)
      - ./:/app/label_api:ro
      - ../utilities:/app/utilities:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - annotation-network
    depends_on:
      redis:
        condition: service_healthy
      label-studio:
        condition: service_healthy
      # vault intentionally not health-gated: it starts sealed after every
      # restart and needs a manual unseal; the app falls back to YAML if
      # Vault is unreachable at startup (see config/vault_client.py)

  # ===========================================
  # MinIO - Object Storage (Optional)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: annotation-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - /media/minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - annotation-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  label_studio_data:
    driver: local
  label_studio_files:
    driver: local
  annotation_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  vault_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  annotation-network:
    driver: bridge

